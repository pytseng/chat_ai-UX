<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="bg" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#F3F7F4"/>
      <stop offset="55%" stop-color="#C8DDD0"/>
      <stop offset="100%" stop-color="#8FB5A0"/>
    </radialGradient>
    <radialGradient id="skin" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F7D7C4"/>
      <stop offset="45%" stop-color="#E8B89A"/>
      <stop offset="100%" stop-color="#C98A6A"/>
    </radialGradient>
    <radialGradient id="hair" cx="40%" cy="22%" r="75%">
      <stop offset="0%" stop-color="#4A3A32"/>
      <stop offset="55%" stop-color="#2C211C"/>
      <stop offset="100%" stop-color="#1A1411"/>
    </radialGradient>
    <radialGradient id="hoodie" cx="40%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#3DCF8E"/>
      <stop offset="40%" stop-color="#0DA85C"/>
      <stop offset="100%" stop-color="#046944"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0A090" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0A090" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Backdrop orb -->
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="63" stroke="url(#rim)" stroke-width="2" fill="none"/>

  <!-- Soft ambient glow -->
  <ellipse cx="48" cy="40" rx="34" ry="26" fill="#FFFFFF" opacity="0.22" filter="url(#soft)"/>

  <!-- Shoulders / hoodie -->
  <path
    d="M18 118c6-28 24-42 46-42s40 14 46 42"
    fill="url(#hoodie)"
  />
  <path
    d="M34 92c8 6 18 9 30 9s22-3 30-9"
    stroke="#FFFFFF"
    stroke-opacity="0.18"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Neck -->
  <path d="M52 78c2 8 8 12 12 12s10-4 12-12" fill="#D7A288"/>

  <!-- Head -->
  <ellipse cx="64" cy="52" rx="28" ry="30" fill="url(#skin)"/>

  <!-- Hair volume -->
  <path
    d="M36 48c2-22 16-34 28-34s26 12 28 34c-4-14-12-22-28-22S40 34 36 48Z"
    fill="url(#hair)"
  />
  <path
    d="M35 52c0-10 4-18 10-22-8 8-10 18-8 28-2-2-2-4-2-6Z"
    fill="#1A1411"
    opacity="0.85"
  />
  <path
    d="M93 52c0-10-4-18-10-22 8 8 10 18 8 28 2-2 2-4 2-6Z"
    fill="#1A1411"
    opacity="0.85"
  />

  <!-- Face highlight -->
  <ellipse cx="54" cy="46" rx="12" ry="14" fill="#FFFFFF" opacity="0.16" filter="url(#soft)"/>

  <!-- Cheeks -->
  <circle cx="48" cy="58" r="6" fill="url(#cheek)"/>
  <circle cx="80" cy="58" r="6" fill="url(#cheek)"/>

  <!-- Eyes -->
  <ellipse cx="52" cy="52" rx="3.2" ry="3.6" fill="#1F1A17"/>
  <ellipse cx="76" cy="52" rx="3.2" ry="3.6" fill="#1F1A17"/>
  <circle cx="51" cy="51" r="1.1" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="75" cy="51" r="1.1" fill="#FFFFFF" opacity="0.85"/>

  <!-- Brows -->
  <path d="M46 46c3-2 7-2.5 10-1" stroke="#2C211C" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M72 45c3-1.5 7-1.5 10 0.5" stroke="#2C211C" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Nose -->
  <path d="M64 54v6c0 1.5-1.5 2.5-3 2" stroke="#C98A6A" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Smile -->
  <path d="M54 66c3.5 4 12.5 4 16 0" stroke="#B56B55" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Ear hints -->
  <ellipse cx="36.5" cy="54" rx="3.5" ry="5" fill="#E0A888"/>
  <ellipse cx="91.5" cy="54" rx="3.5" ry="5" fill="#E0A888"/>
</svg>
